<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Blanca Gourmet</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap">
    <script>document.documentElement.classList.add('js')</script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>

<body>
    <header class="header" id="inicio">
        <div class="header_first_content">
            <button class="menu-toggle" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <nav class="menu" id="menu" aria-label="Menu do site" hidden>
                <ul>
                    <li><a href="#inicio">Início</a></li>
                    <li><a href="#sobre">Sobre</a></li>
                    <li><a href="#servicos">Serviços</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>

            <a href="#inicio" class="logo_img">
                <img src="assets/images/casablanca_logo.png" alt="Casa Blanca Gourmet">
            </a>

            <button class="cart-toggle" aria-label="Abrir carrinho">
                <img src="assets/images/carticon.png" alt="">
                <span class="cart-count" hidden>0</span>
            </button>
        </div>

        <div class="header_search_content">
            <input type="search" class="search" aria-label="Buscar" placeholder="Buscar café, lanches...">
            <button class="tune" aria-label="Filtros">
                <img src="assets/images/tune.png" alt="">
            </button>
        </div>
    </header>

    <aside class="cart-sidebar">
        <button class="cart-close" aria-label="Fechar carrinho">
            &times;
        </button>

        <div class="cart-container">

            <header class="cart-header">
                <h2>Meu carrinho</h2>
            </header>

            <div class="cart-products">

                

            </div>

            <div class="cart-summary">

                <div class="cart-summary-row">
                    <span>Subtotal</span>
                    <span class="cart-subtotal">R$ 0,00</span>
                </div>
    
                <div class="cart-summary-row">
                    <span>Desconto</span>
                    <span class="cart-discount">R$ 0,00</span>
                </div>

                <div class="cart-summary-total">
                    <strong>Total</strong>
                    <strong class="cart-total">R$ 0,00</strong>
                </div>

            </div>

            <footer class="cart-footer">

                <button class="cart-checkout">
                    Finalizar pedido
                </button>

            </footer>

        </div>
    </aside>

    <main>

        <section class="promotions" aria-label="Ofertas e promoções">

            <div class="carousel reveal">

                <div class="carousel-track">

                    <article class="carousel-item">
                        <a href="#oferta1">
                            <img src="assets/images/carrosel2.jpg" alt="Promoção especial de produtos">
                        </a>
                    </article>

                    <article class="carousel-item">
                        <a href="#oferta2">
                            <img src="assets/images/carrosel3.jpg" alt="Confira nossos produtos em oferta">
                        </a>
                    </article>

                    <article class="carousel-item">
                        <a href="#oferta3">
                            <img src="assets/images/carrosel4.jpg" alt="Novidades da nossa loja">
                        </a>
                    </article>

                    <article class="carousel-item">
                        <a href="#oferta4">
                            <img src="assets/images/carrosel1.jpg" alt="Produtos selecionados com desconto">
                        </a>
                    </article>

                </div>

                <div class="carousel-indicators" aria-label="Selecionar banner"></div>

            </div>

        </section>

        <section class="categories reveal" aria-label="Categorias">

            <div class="categories_list">
                <a href="#cafe" class="category_item">
                    <i class="bi bi-cup-hot"></i>
                    <span>Café</span>
                </a>

                <a href="#salgados" class="category_item">
                    <i class="ph ph-pizza"></i>
                    <span>Salgados</span>
                </a>

                <a href="#sanduiches" class="category_item">
                    <i class="ph ph-hamburger"></i>
                    <span>Sanduíches</span>
                </a>

                <a href="#sobremesas" class="category_item">
                    <i class="bi bi-cake2"></i>
                    <span>Sobremesas</span>
                </a>

                <a href="#drinks" class="category_item">
                    <i class="bi bi-cup-straw"></i>
                    <span>Drinks</span>
                </a>

                <a href="#refeicoes" class="category_item">
                    <i class="bi bi-egg-fried"></i>
                    <span>Refeições</span>
                </a>
            </div>
        </section>

        <section class="popular-products" aria-labelledby="popular-title">

            <div class="section-header reveal">
                <h2 id="popular-title">Popular Picks</h2>

                <a href="#todos-produtos" class="view-all">
                    View All
                </a>
            </div>

            <div class="products-list">

               

            </div>

        </section>

        <section class="secondary_promotions reveal" aria-labelledby="secondary-promotion-title">

            <div class="promotion_content">

                <span class="promotion_label">Weekend Special</span>

                <h2 id="secondary-promotion-title">20% OFF</h2>

                <p>On all coffee orders</p>

                <a href="#cafe" class="promotion_button">
                    Order Now
                    <span aria-hidden="true">→</span>
                </a>

            </div>

            <div class="promotion_image">
                <img src="assets/images/vinte2.jpg" alt="Café gelado com gelo">
            </div>

        </section>
    </main>

    <nav class="bottom_navigation" aria-label="Navegação principal">

        <a href="#inicio" class="navigation_item active" aria-current="page">
            <span class="navigation_icon" aria-hidden="true"><i class="bi bi-house"></i></span>
            <span>Home</span>
        </a>

        <a href="#cardapio" class="navigation_item">
            <span class="navigation_icon" aria-hidden="true"><i class="bi bi-book"></i></span>
            <span>Menu</span>
        </a>

        <a href="#pedidos" class="navigation_item navigation_order">
            <span class="navigation_icon" aria-hidden="true"><i class="bi bi-cup-hot"></i></span>
            <span>Order</span>
        </a>

        <a href="#rewards" class="navigation_item">
            <span class="navigation_icon" aria-hidden="true"><i class="bi bi-gift"></i></span>
            <span>Rewards</span>
        </a>

        <a href="#perfil" class="navigation_item">
            <span class="navigation_icon" aria-hidden="true"><i class="bi bi-person"></i></span>
            <span>Profile</span>
        </a>

    </nav>
    <script src="assets/script/products.js"></script>
    <script src="assets/script/script.js"></script>
</body>

</html>
